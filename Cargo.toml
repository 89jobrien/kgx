[workspace]
members = ["crates/kgx", "crates/kgx-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Joseph O'Brien"]

[workspace.dependencies]
kgx = { path = "crates/kgx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"
assert_cmd = "2"
